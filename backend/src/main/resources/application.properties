spring.application.name=ecommerce-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:ecommerce}
spring.datasource.password=${DB_PASSWORD:ecommerce}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please-use-env-in-production}
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
